<!DOCTYPE html>
<html lang="pl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a192f">
    <meta name="description" content="Profesjonalny montaż samochodu - realistyczne części i konstrukcja pojazdu">
    <title>Auto Builder Pro - Realistyczny montaż samochodu</title>
    
    <!-- Biblioteki Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #0a192f 0%, #0d2b3e 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Nowoczesny, przemysłowy interfejs */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        .top-bar {
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #4a9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .level-badge {
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            border-left: 3px solid #ffaa00;
        }

        .progress-container {
            background: rgba(0, 0, 0, 0.4);
            height: 4px;
            width: 100%;
        }

        .progress-fill {
            background: linear-gradient(90deg, #4caf50, #8bc34a, #ffd966);
            width: 0%;
            height: 100%;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .game-layout {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }

        /* Panel części - realistyczny grid */
        .parts-panel {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .parts-panel h2 {
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: #bbd9ff;
        }

        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding: 4px;
        }

        .part-card {
            background: rgba(20, 40, 60, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: grab;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        .part-card:active {
            cursor: grabbing;
        }

        .part-card.placed {
            opacity: 0.4;
            filter: grayscale(0.5);
            cursor: default;
            pointer-events: none;
            border-color: #4caf50;
        }

        .part-icon svg {
            width: 56px;
            height: 56px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .part-name {
            font-size: 0.65rem;
            font-weight: 500;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 20px;
        }

        /* Obszar montażu - realistyczny szkielet */
        .assembly-area {
            flex: 1.5;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 32px;
            padding: 12px;
            position: relative;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .car-canvas {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-skeleton {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* strefy drop z bardziej realistycznym wyglądem */
        .drop-slot {
            position: absolute;
            border: 2px dashed rgba(255, 200, 100, 0.5);
            border-radius: 12px;
            background: rgba(255, 215, 0, 0.05);
            transition: all 0.2s;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-slot.filled {
            border: 2px solid rgba(76, 175, 80, 0.8);
            background: rgba(76, 175, 80, 0.15);
            backdrop-filter: blur(2px);
        }

        .drop-slot.highlight {
            background: rgba(255, 210, 0, 0.3);
            border-color: #ffaa33;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
        }

        .drop-slot svg {
            width: 85%;
            height: 85%;
            opacity: 0.9;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #2c3e66, #1a2a4f);
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
        }

        .modal-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
        }

        .modal-3d.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(145deg, #0c1f2e, #07121c);
            width: 90%;
            max-width: 550px;
            border-radius: 48px;
            padding: 20px;
            border: 1px solid rgba(255,215,0,0.5);
            box-shadow: 0 30px 40px rgba(0,0,0,0.6);
        }

        .viewer-3d {
            height: 320px;
            border-radius: 28px;
            background: #0a0f1a;
            margin: 12px 0;
            position: relative;
            overflow: hidden;
        }

        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transform: scale(1.1);
            transition: 0.02s linear;
        }

        @keyframes pulseDrop {
            0% { box-shadow: 0 0 0 0 rgba(255,200,0,0.6);}
            100% { box-shadow: 0 0 0 12px rgba(255,200,0,0);}
        }

        .hint-animation {
            animation: pulseDrop 0.8s ease-out;
        }
    </style>
</head>

    const levelNumSpan = document.getElementById('level-num');
    const carNameSpan = document.getElementById('car-name');
    const resetBtn = document.getElementById('resetBtn');
    const hintBtn = document.getElementById('hintBtn');
    const nextBtn = document.getElementById('nextLevelBtn');
    const modal3d = document.getElementById('modal3d');
    const threeContainer = document.getElementById('threeContainer');
    const modalCarName = document.getElementById('modalCarName');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const nextModalBtn = document.getElementById('nextModalBtn');
    
    let scene, camera, renderer, controls, currentModel;
    let rotationEnabled = false;
    
    function initThree() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1a);
        camera = new THREE.PerspectiveCamera(45, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 4);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        renderer.shadowMap.enabled = true;
        threeContainer.innerHTML = '';
        threeContainer.appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = false;
        controls.enableZoom = true;
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.PointLight(0x4466cc, 0.4);
        fillLight.position.set(-1, 1, 2);
        scene.add(fillLight);
        const animate = () => {
            requestAnimationFrame(animate);
            controls.update();
            if (currentModel && rotationEnabled) currentModel.rotation.y += 0.008;
            renderer.render(scene, camera);
        };
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        });
    }
    
    function loadRealisticModel(brand, colorHex) {
        if (currentModel) scene.remove(currentModel);
        const group = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.85, roughness: 0.25, emissive: 0x000000 });
        const bodyGeo = new THREE.BoxGeometry(1.9, 0.5, 0.9);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.15;
        body.castShadow = true;
        group.add(body);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.3 });
        const roofGeo = new THREE.BoxGeometry(1.2, 0.25, 0.8);
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 0.45, -0.05);
        group.add(roof);
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x88aaff, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.45 });
        const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.2, 0.05), glassMat);
        windshield.position.set(0, 0.35, 0.48);
        group.add(windshield);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.6, roughness: 0.4 });
        const wheelGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.2, 24);
        const positions = [[-0.9, 0.05, 0.65], [0.9, 0.05, 0.65], [-0.9, 0.05, -0.65], [0.9, 0.05, -0.65]];
        positions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.rotation.z = Math.PI/2;
            group.add(wheel);
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.21, 8), new THREE.MeshStandardMaterial({ color: 0xccccaa, metalness: 0.9 }));
            rim.position.set(pos[0], pos[1], pos[2]);
            rim.rotation.z = Math.PI/2;
            group.add(rim);
        });
        group.scale.set(0.85, 0.85, 0.85);
        scene.add(group);
        currentModel = group;
        controls.target.set(0, 0.2, 0);
        controls.update();
    }
    
    function loadLevel() {
        const level = levels[currentLvlIdx];
        totalParts = level.parts.length;
        placedCount = 0;
        progressFill.style.width = '0%';
        nextBtn.disabled = true;
        levelNumSpan.innerText = currentLvlIdx+1;
        carNameSpan.innerText = level.brand;
        partsGridEl.innerHTML = '';
        carSkeleton.innerHTML = generateCarSilhouette(level.brand);
        level.parts.forEach(part => {
            const card = document.createElement('div');
            card.className = 'part-card';
            card.dataset.id = part.id;
            const iconSvg = realisticParts[part.icon] || realisticParts.hood;
            card.innerHTML = `<div class="part-icon">${iconSvg}</div><div class="part-name">${part.name}</div>`;
            partsGridEl.appendChild(card);
            const slot = document.createElement('div');
            slot.className = 'drop-slot';
            slot.dataset.id = part.id;
            slot.style.left = `${part.x}%`;
            slot.style.top = `${part.y}%`;
            slot.style.width = `${part.w}%`;
            slot.style.height = `${part.h}%`;
            carSkeleton.appendChild(slot);
        });
    }
    
    function updateProgress() {
        const percent = (placedCount / totalParts) * 100;
        progressFill.style.width = `${percent}%`;
        if (placedCount === totalParts) {
            nextBtn.disabled = false;
            setTimeout(() => {
                modalCarName.innerText = levels[currentLvlIdx].brand;
                initThree();
                loadRealisticModel(levels[currentLvlIdx].brand, levels[currentLvlIdx].color);
                modal3d.classList.add('show');
                rotationEnabled = true;
            }, 300);
        }
    }
    
    function endDrag(x, y) {
        if (!cloneElement) return;
        const slots = document.querySelectorAll('.drop-slot');
        let matched = false;
        slots.forEach(slot => {
            const rect = slot.getBoundingClientRect();
            if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom && slot.dataset.id === activePartId && !slot.classList.contains('filled')) {
                slot.classList.add('filled');
                const partDef = levels[currentLvlIdx].parts.find(p => p.id === activePartId);
                if (partDef) slot.innerHTML = realisticParts[partDef.icon];
                const card = partsGridEl.querySelector(`.part-card[data-id="${activePartId}"]`);
                if (card) card.classList.add('placed');
                placedCount++;
                updateProgress();
                matched = true;
            }
            slot.classList.remove('highlight');
        });
        cloneElement.remove();
        cloneElement = null;
        activePartId = null;
    }
    
    function attachDragEvents() {
        const cards = document.querySelectorAll('.part-card:not(.placed)');
        cards.forEach(card => {
            const startDrag = (e) => {
                if (card.classList.contains('placed')) return;
                e.preventDefault();
                const clientX = e.clientX ?? e.touches?.[0]?.clientX;
                const clientY = e.clientY ?? e.touches?.[0]?.clientY;
                if (!clientX) return;
                activePartId = card.dataset.id;
                cloneElement = card.cloneNode(true);
                cloneElement.style.position = 'fixed';
                cloneElement.style.left = `${clientX - 40}px`;
                cloneElement.style.top = `${clientY - 40}px`;
                cloneElement.style.width = '90px';
                cloneElement.style.opacity = '0.85';
                cloneElement.style.zIndex = '9999';
                cloneElement.style.pointerEvents = 'none';
                cloneElement.classList.add('drag-clone');
                document.body.appendChild(cloneElement);
            };
            card.addEventListener('mousedown', startDrag);
            card.addEventListener('touchstart', startDrag, { passive: false });
        });
    }
    
    function globalMoveHandler(e) {
        if (!cloneElement) return;
        e.preventDefault();
        const clientX = e.clientX ?? e.touches?.[0]?.clientX;
        const clientY = e.clientY ?? e.touches?.[0]?.clientY;
        cloneElement.style.left = `${clientX - 45}px`;
        cloneElement.style.top = `${clientY - 45}px`;
        const slots = document.querySelectorAll('.drop-slot');
        slots.forEach(slot => {
            const rect = slot.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom && slot.dataset.id === activePartId && !slot.classList.contains('filled')) {
                slot.classList.add('highlight');
            } else slot.classList.remove('highlight');
        });
    }
    
    function globalUpHandler(e) {
        if (!cloneElement) return;
        const clientX = e.clientX ?? e.changedTouches?.[0]?.clientX;
        const clientY = e.clientY ?? e.changedTouches?.[0]?.clientY;
        endDrag(clientX, clientY);
    }
    
    resetBtn.addEventListener('click', () => { loadLevel(); attachDragEvents(); });
    hintBtn.addEventListener('click', () => {
        const unplaced = Array.from(document.querySelectorAll('.part-card:not(.placed)'));
        if (!unplaced.length) return;
        const randomCard = unplaced[Math.floor(Math.random() * unplaced.length)];
        const pid = randomCard.dataset.id;
        const targetSlot = document.querySelector(`.drop-slot[data-id="${pid}"]`);
        if (targetSlot) targetSlot.classList.add('hint-animation');
        setTimeout(() => targetSlot?.classList.remove('hint-animation'), 800);
    });
    nextBtn.addEventListener('click', () => {
        if (currentLvlIdx + 1 < levels.length) {
            currentLvlIdx++;
            loadLevel();
            attachDragEvents();
        } else {
            alert("Gratulacje! Ukończyłeś wszystkie modele! 🎉");
        }
    });
    closeModalBtn.addEventListener('click', () => { modal3d.classList.remove('show'); rotationEnabled = false; if(currentModel) currentModel.rotation.y = 0; });
    nextModalBtn.addEventListener('click', () => { modal3d.classList.remove('show'); if(currentLvlIdx+1 < levels.length) { currentLvlIdx++; loadLevel(); attachDragEvents(); } else alert("Koniec wszystkich poziomów!"); });
    document.addEventListener('mousemove', globalMoveHandler);
    document.addEventListener('touchmove', globalMoveHandler, { passive: false });
    document.addEventListener('mouseup', globalUpHandler);
    document.addEventListener('touchend', globalUpHandler);
    
    loadLevel();
    attachDragEvents();
</script>
</body>
</html>
