<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auto Assembly Pro - Realistyczny montaż samochodu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0c1a2b 0%, #0a111f 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: pan-x pan-y;
        }

        /* Główna struktura */
        .game-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
        }

        /* Header */
        .game-header {
            background: rgba(10, 25, 47, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 200, 80, 0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, #fff, #4db8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .badge {
            background: #00000066;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            border-left: 3px solid gold;
        }
        .progress-bar {
            background: #1e2a3a;
            border-radius: 12px;
            height: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            background: linear-gradient(90deg, #4caf50, #ffd966);
            width: 0%;
            height: 100%;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* Dwa główne panele */
        .game-panels {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .parts-panel {
            flex: 1.2;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
            max-height: 58vh;
            overflow-y: auto;
            padding: 4px;
        }
        .part-card {
            background: rgba(20, 35, 55, 0.8);
            border-radius: 20px;
            padding: 10px 6px;
            text-align: center;
            cursor: grab;
            transition: all 0.2s;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        .part-card:active { cursor: grabbing; }
        .part-card.placed {
            opacity: 0.35;
            filter: grayscale(0.6);
            pointer-events: none;
            border-color: #4caf50;
        }
        .part-icon svg { width: 54px; height: 54px; filter: drop-shadow(0 2px 6px black); }
        .part-name { font-size: 0.65rem; margin-top: 6px; font-weight: 500; background: #00000066; display: inline-block; padding: 2px 8px; border-radius: 20px;}

        /* Obszar montażu - SZKIELET SAMOCHODU premium */
        .assembly-panel {
            flex: 1.8;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 12px;
            border: 1px solid rgba(255, 180, 50, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .car-chassis {
            width: 100%;
            aspect-ratio: 1 / 0.65;
            position: relative;
            background: radial-gradient(ellipse at 50% 80%, rgba(0,0,0,0.3), transparent);
            border-radius: 28px;
        }
        .skeleton-svg-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .skeleton-svg-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .drop-slot {
            position: absolute;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 12px;
            background: rgba(255,215,0,0.05);
            border: 2px dashed rgba(255,200,100,0.6);
            pointer-events: none;
        }
        .drop-slot.filled {
            background: rgba(76, 175, 80, 0.25);
            border: 2px solid rgba(76, 175, 80, 0.9);
            backdrop-filter: blur(2px);
        }
        .drop-slot.highlight {
            background: rgba(255, 200, 50, 0.4);
            border-color: #ffaa33;
            transform: scale(1.02);
            box-shadow: 0 0 15px gold;
        }
        .drop-slot svg {
            width: 90%;
            height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Przyciski */
        .action-buttons {
            display: flex;
            gap: 12px;
            padding: 8px 0;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #2a3f60, #1a2a44);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 12px black;
            border: 1px solid rgba(255,215,0,0.3);
        }
        button:active { transform: scale(0.96);}
        button:disabled { opacity: 0.5;}

        /* Modal 3D */
        .modal-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-3d.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: linear-gradient(145deg, #0f212f, #07121c);
            width: 90%;
            max-width: 550px;
            border-radius: 48px;
            padding: 20px;
            border: 1px solid gold;
            box-shadow: 0 25px 40px black;
        }
        .viewer-3d {
            height: 320px;
            border-radius: 32px;
            background: #050a12;
            margin: 15px 0;
            overflow: hidden;
        }
        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            filter: drop-shadow(0 10px 20px black);
            transform: scale(1.1);
            transition: none;
        }
        @keyframes hintPulse {
            0% { box-shadow: 0 0 0 0 #ffcc44; border-color: #ffaa33; }
            100% { box-shadow: 0 0 0 12px rgba(255,200,0,0); }
        }
        .hint-effect {
            animation: hintPulse 0.7s ease-out;
        }
        @media (max-width: 700px) {
            .game-panels { flex-direction: column; }
            .parts-grid { max-height: 35vh; }
            .part-icon svg { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-header">
        <h1>⚡ CAR ASSEMBLY PRO</h1>
        <div class="badge"><span id="levelCounter">1</span>/3 • <span id="carModelName">Volkswagen Golf R</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="game-panels">
        <div class="parts-panel">
            <div class="parts-grid" id="partsGrid"></div>
        </div>
        <div class="assembly-panel">
            <div class="car-chassis" id="carChassis">
                <div class="skeleton-svg-container" id="skeletonContainer"></div>
            </div>
        </div>
    </div>
    <div class="action-buttons">
        <button id="resetGameBtn">🔄 Resetuj</button>
        <button id="hintGameBtn">💡 Podpowiedź</button>
        <button id="nextGameBtn" disabled>➡️ Następny model</button>
    </div>
</div>

<div class="modal-3d" id="threeModal">
    <div class="modal-card">
        <h3 style="text-align:center; color:gold;">🏆 Złożono: <span id="modalCarTitle"></span></h3>
        <div class="viewer-3d" id="threeContainer"></div>
        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button id="close3dBtn" style="background:#2c3e66;">Zamknij</button>
            <button id="nextLevel3dBtn" style="background:#ffaa33; color:#1e2a3a;">Następny poziom →</button>
        </div>
    </div>
</div>

            return `<svg viewBox="0 0 100 100"><path d="M18,50 L24,32 L36,24 L64,24 L76,32 L82,50 L82,70 L70,76 L30,76 L18,70Z" fill="rgba(255,255,255,0.05)" stroke="#66ccff" stroke-width="1.2"/><path d="M36,30 L64,30" stroke="#66ccff"/><circle cx="30" cy="62" r="5" fill="none" stroke="#ff5555"/><circle cx="70" cy="62" r="5" fill="none" stroke="#ff5555"/><path d="M46 28 L54 28" stroke="silver"/></svg>`;
        } else {
            return `<svg viewBox="0 0 100 100"><path d="M22,50 L28,32 L40,26 L60,26 L72,32 L78,50 L78,72 L68,78 L32,78 L22,72Z" fill="rgba(255,255,255,0.06)" stroke="#ffaa66" stroke-width="1.4"/><path d="M40,30 L60,30" stroke="#ffaa66"/><ellipse cx="30" cy="64" rx="7" ry="6" fill="none" stroke="#ff7777"/><ellipse cx="70" cy="64" rx="7" ry="6" fill="none" stroke="#ff7777"/><path d="M28,26 L72,26" stroke="gold"/></svg>`;
        }
    }
    
    // Globalne zmienne
    let currentLvl = 0;
    let placedPartsCount = 0;
    let totalPartsCount = 0;
    let activeDragId = null;
    let dragClone = null;
    let isDragging = false;
    
    const partsGridDiv = document.getElementById('partsGrid');
    const skeletonContainer = document.getElementById('skeletonContainer');
    const progressFill = document.getElementById('progressFill');
    const levelCounterSpan = document.getElementById('levelCounter');
    const carModelSpan = document.getElementById('carModelName');
    const resetBtn = document.getElementById('resetGameBtn');
    const hintBtn = document.getElementById('hintGameBtn');
    const nextBtn = document.getElementById('nextGameBtn');
    const threeModal = document.getElementById('threeModal');
    const threeContainer = document.getElementById('threeContainer');
    const modalCarTitle = document.getElementById('modalCarTitle');
    const close3dBtn = document.getElementById('close3dBtn');
    const nextLevel3dBtn = document.getElementById('nextLevel3dBtn');
    
    // Three.js
    let scene, camera, renderer, controls, currentModelGroup;
    let autoRotate = false;
    
    function initThree() {
        if (!threeContainer) return;
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a12);
        camera = new THREE.PerspectiveCamera(40, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
        camera.position.set(2.5, 1.5, 4);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        renderer.shadowMap.enabled = true;
        threeContainer.innerHTML = '';
        threeContainer.appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = false;
        controls.enableZoom = true;
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(2, 4, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x5577aa, 0.5);
        fillLight.position.set(-1, 2, 2);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.6);
        rimLight.position.set(1, 1.5, -2);
        scene.add(rimLight);
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (autoRotate && currentModelGroup) currentModelGroup.rotation.y += 0.008;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        });
    }
    
    function loadRealisticCarModel(brand, colorHex) {
        if (currentModelGroup) scene.remove(currentModelGroup);
        const group = new THREE.Group();
        // nadwozie główne
        const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.92, roughness: 0.22, emissive: 0x000000 });
        const bodyGeo = new THREE.BoxGeometry(2.0, 0.55, 1.05);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.15;
        body.castShadow = true;
        group.add(body);
        // dach
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.4 });
        const roofGeo = new THREE.BoxGeometry(1.3, 0.28, 0.9);
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 0.52, -0.05);
        group.add(roof);
        // szyby
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x88bbff, metalness: 0.2, roughness: 0.08, transparent: true, opacity: 0.55 });
        const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.2, 0.06), glassMat);
        windshield.position.set(0, 0.42, 0.58);
        group.add(windshield);
        const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.18, 0.06), glassMat);
        rearGlass.position.set(0, 0.42, -0.68);
        group.add(rearGlass);
        // koła
        const wheelMatMetal = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.3 });
        const wheelGeo = new THREE.CylinderGeometry(0.23, 0.23, 0.22, 32);
        const positions = [[-0.95, 0.09, 0.75], [0.95, 0.09, 0.75], [-0.95, 0.09, -0.75], [0.95, 0.09, -0.75]];
        positions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMatMetal);
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.rotation.z = Math.PI/2;
            group.add(wheel);
            const rimGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.23, 12);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddd99, metalness: 0.88 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.position.set(pos[0], pos[1], pos[2]);
            rim.rotation.z = Math.PI/2;
            group.add(rim);
        });
        // detale: atrapa
        const grilleMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.3 });
        const grilleBox = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.05), grilleMat);
        grilleBox.position.set(0, 0.22, 1.02);
        group.add(grilleBox);
        group.scale.set(0.88, 0.88, 0.88);
        scene.add(group);
        currentModelGroup = group;
        controls.target.set(0, 0.2, 0);
        controls.update();
    }
    
    function buildLevel() {
        const level = levels[currentLvl];
        totalPartsCount = level.parts.length;
        placedPartsCount = 0;
        progressFill.style.width = '0%';
        nextBtn.disabled = true;
        levelCounterSpan.innerText = currentLvl+1;
        carModelSpan.innerText = level.brand;
        skeletonContainer.innerHTML = getCarSkeletonSVG(level.brand);
        partsGridDiv.innerHTML = '';
        level.parts.forEach(part => {
            const card = document.createElement('div');
            card.className = 'part-card';
            card.dataset.id = part.id;
            card.innerHTML = `<div class="part-icon">${partSVG[part.icon] || partSVG.hood}</div><div class="part-name">${part.name}</div>`;
            partsGridDiv.appendChild(card);
            const slot = document.createElement('div');
            slot.className = 'drop-slot';
            slot.dataset.id = part.id;
            slot.style.left = `${part.x}%`;
            slot.style.top = `${part.y}%`;
            slot.style.width = `${part.w}%`;
            slot.style.height = `${part.h}%`;
            skeletonContainer.parentElement?.appendChild(slot);
        });
        attachDragEvents();
    }
    
    function attachDragEvents() {
        document.querySelectorAll('.part-card:not(.placed)').forEach(card => {
            const start = (e) => {
                if (card.classList.contains('placed')) return;
                e.preventDefault();
                const clientX = e.clientX ?? e.touches?.[0]?.clientX;
                const clientY = e.clientY ?? e.touches?.[0]?.clientY;
                if (!clientX) return;
                activeDragId = card.dataset.id;
                dragClone = card.cloneNode(true);
                dragClone.classList.add('drag-clone');
                dragClone.style.left = `${clientX - 50}px`;
                dragClone.style.top = `${clientY - 50}px`;
                dragClone.style.width = '90px';
                document.body.appendChild(dragClone);
                isDragging = true;
            };
            card.addEventListener('mousedown', start);
            card.addEventListener('touchstart', start, { passive: false });
        });
    }
    
    function handleMove(e) {
        if (!dragClone) return;
        e.preventDefault();
        const clientX = e.clientX ?? e.touches?.[0]?.clientX;
        const clientY = e.clientY ?? e.touches?.[0]?.clientY;
        dragClone.style.left = `${clientX - 50}px`;
        dragClone.style.top = `${clientY - 50}px`;
        const slots = document.querySelectorAll('.drop-slot');
        slots.forEach(slot => {
            const rect = slot.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom && slot.dataset.id === activeDragId && !slot.classList.contains('filled')) {
                slot.classList.add('highlight');
            } else slot.classList.remove('highlight');
        });
    }
    
    function handleEnd(e) {
        if (!dragClone) return;
        const clientX = e.clientX ?? e.changedTouches?.[0]?.clientX;
        const clientY = e.clientY ?? e.changedTouches?.[0]?.clientY;
        const slots = document.querySelectorAll('.drop-slot');
        let matched = false;
        slots.forEach(slot => {
            const rect = slot.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom && slot.dataset.id === activeDragId && !slot.classList.contains('filled')) {
                slot.classList.add('filled');
                const partDef = levels[currentLvl].parts.find(p => p.id === activeDragId);
                if (partDef) slot.innerHTML = partSVG[partDef.icon];
                const originalCard = partsGridDiv.querySelector(`.part-card[data-id="${activeDragId}"]`);
                if (originalCard) originalCard.classList.add('placed');
                placedPartsCount++;
                const percent = (placedPartsCount / totalPartsCount) * 100;
                progressFill.style.width = `${percent}%`;
                if (placedPartsCount === totalPartsCount) {
                    nextBtn.disabled = false;
                    setTimeout(() => {
                        modalCarTitle.innerText = levels[currentLvl].brand;
                        initThree();
                        loadRealisticCarModel(levels[currentLvl].brand, levels[currentLvl].color);
                        threeModal.classList.add('show');
                        autoRotate = true;
                    }, 200);
                }
                matched = true;
            }
            slot.classList.remove('highlight');
        });
        dragClone.remove();
        dragClone = null;
        activeDragId = null;
        isDragging = false;
        attachDragEvents();
    }
    
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('touchmove', handleMove, { passive: false });
    document.addEventListener('mouseup', handleEnd);
    document.addEventListener('touchend', handleEnd);
    
    resetBtn.addEventListener('click', () => { buildLevel(); });
    hintBtn.addEventListener('click', () => {
        const unplaced = Array.from(document.querySelectorAll('.part-card:not(.placed)'));
        if (!unplaced.length) return;
        const randCard = unplaced[Math.floor(Math.random() * unplaced.length)];
        const pid = randCard.dataset.id;
        const targetSlot = document.querySelector(`.drop-slot[data-id="${pid}"]`);
        if (targetSlot) targetSlot.classList.add('hint-effect');
        setTimeout(() => targetSlot?.classList.remove('hint-effect'), 800);
    });
    function nextLevelAction() {
        if (currentLvl + 1 < levels.length) {
            currentLvl++;
            buildLevel();
            threeModal.classList.remove('show');
            autoRotate = false;
            if (currentModelGroup) scene?.remove(currentModelGroup);
        } else {
            alert("🏁 Gratulacje! Ukończyłeś wszystkie modele! Świetna robota!");
        }
    }
    nextBtn.addEventListener('click', nextLevelAction);
    nextLevel3dBtn.addEventListener('click', () => { threeModal.classList.remove('show'); nextLevelAction(); });
    close3dBtn.addEventListener('click', () => { threeModal.classList.remove('show'); autoRotate = false; });
    buildLevel();
</script>
</body>
</html>
